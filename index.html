naux differents en debut de parcours."},{c:'g',b:'Pourquoi un simple message texte ne suffit plus',t:" : un message generique du type \\\"Je suis closer spécialisé en [niche], vous cherchez quelqu'un ?\\\" se noie aujourd'hui dans la masse — tout le monde envoie ce genre de message. Ce qui te differencie reellement, c'est de montrer ta posture en action plutot que de la decrire. Un extrait video (Loom ou autre) de quelques minutes ou tu presentes ta méthode, ou encore mieux, un court passage d'un jeu de rôle enregistre ou d'une vraie découverte de 10 minutes ou l'on te voit challenger sincerement un prospect, vaut infiniment plus qu'un texte : ça prouve ta competence au lieu de l'affirmer."},{c:'g',b:'Se positionner sans se cacher',t:" : a terme, l'objectif est que le marche te trouve grace a ta reputation et tes résultats plutot que l'inverse. Mais au tout debut de ton parcours, tu n'as pas encore cette reputation — donc il faut aller la chercher activement. Ne confonds jamais \\\"se positionner\\\" avec \\\"attendre passivement\\\" : les premiers mois, c'est toi qui dois faire la demarche, contacter, proposer, te montrer. Le personal branding et l'inbound viennent apres, une fois que tu as des résultats concrets a montrer."}],ex:{l:'Premier pas concret',t:"Aujourd'hui, contacte 5 infopreneurs ou entrepreneurs actifs dans une niche qui t'interesse. Pas demain, pas cette semaine — aujourd'hui. Pour au moins 2 d'entre eux, joins un court extrait (Loom ou enregistrement audio/video) d'un jeu de rôle ou d'une découverte que tu as menee, même en entraînement. Montre ta posture, ne te contente pas de la decrire."},gold:{l:'Ce qui compte vraiment dans cette phase',t:"Le nombre d'appels que tu rates n'est pas la mesure de ton succes pendant cette periode — la vitesse a laquelle tu identifies et corriges tes erreurs l'est. Deux closers peuvent faire tous les deux 80 appels ratés : celui qui a debriefe chaque appel (voir chapitre \\\"Analyser tes appels\\\") en sort avec une méthode affinee. Celui qui n'a rien note en sort avec juste de la fatigue."},scripts:null},
{n:'02',tc:'g',tag:'Operationnel',t:"Construire ton CRM",i:"Un CRM (Customer Relationship Management, ou gestion de la relation client) est simplement un outil ou tu centralises tout ce que tu sais sur chacun de tes prospects et clients : qui ils sont, ou ils en sont dans le processus, ce qu'ils t'ont dit, ce qui les bloque, et ce que tu dois faire ensuite. Un closer sans CRM, c'est un chef sans recette : il peut reussir un plat par instinct une fois, mais il est incapable de répéter méthodiquement ce qui a marche, et il oublie une bonne partie de ce qu'il a appris d'un client a l'autre.\n\nSans CRM, tu perds trois choses essentielles : la mémoire de chaque prospect (tu redecouvres a chaque relance des informations que tu avais deja), la vision d'ensemble de ton pipeline (tu ne sais plus combien de prospects sont reellement chauds), et surtout, la capacité a analyser tes propres patterns de reussite et d'echec. Le CRM n'est pas une contrainte administrative — c'est l'outil qui transforme ton expérience brute en méthode reutilisable.",pts:[{c:'g',b:'Les colonnes essentielles',t:" : au minimum, ton CRM doit contenir le nom du prospect, la source (comment tu l'as trouve), la date du premier contact, le statut actuel (a contacter, relance en cours, signe, perdu et pourquoi), le profil psychologique détecte (DISC ou autre grille que tu utilises), le niveau d'urgence, l'objection principale identifiee, la prochaine action prevue et sa date, et le montant potentiel de la vente."},{c:'g',b:'Le scoring psycho',t:" : pour chaque prospect, note son profil DISC (ou la grille comportementale que tu utilises), ses objections recurrentes, et son niveau d'urgence sur une echelle simple (1 a 5 par exemple). Ce scoring te permet, avant chaque relance, de te repreparer en 30 secondes au lieu de repartir de zero — tu sais deja comment parler a ce prospect spécifique."},{c:'g',b:'Le debrief',t:" : consacre 10 minutes apres chaque appel, sans exception, pour noter ce qui s'est passe : ton état interne avant l'appel, le schema psychologique détecte chez le prospect, les moments ou tu as devie de ta méthode, l'objection qui a surgi, et ce qui a bien fonctionne. Ces 10 minutes sont probablement l'habitude la plus rentable de tout ce module — voir le chapitre suivant pour la méthode complète d'analyse."},{c:'g',b:'Google Sheets, Notion, ou un CRM dedie ?',t:" : tu n'es absolument pas oblige de partir sur Google Sheets. C'est simplement l'option la plus simple et gratuite pour demarrer. Notion fonctionne tout aussi bien en construisant une base de donnees avec les mêmes colonnes, avec l'avantage de pouvoir y ajouter des notes plus riches et des liens vers tes enregistrements d'appels. Des outils comme Attio, Airtable ou HubSpot (version gratuite) proposent en plus des automatisations : rappels automatiques de relance, integration avec ta boite mail, voire des fonctionnalites d'intelligence artificielle qui resument automatiquement tes notes ou detectent des patterns dans tes pertes. Le bon outil est celui que tu rempliras reellement a chaque appel — la simplicite prime sur la sophistication au debut."}],ex:{l:'Ressource — Modele de CRM pret a l\'emploi',t:"Un exemple complet de CRM au format tableur (Google Sheets / Excel) est disponible en ressource telechargeable de ce module. Il contient 3 onglets : Pipeline (ton suivi prospect par prospect avec listes deroulantes pretes a l'emploi), Debrief (ta fiche post-appel), et Tableau de bord (tes statistiques cles calculees automatiquement : taux de conversion, chiffre d'affaires genere, repartition des pertes). Duplique-le, adapte les colonnes a ta niche, et commence a le remplir des ton prochain appel."},gold:{l:'La discipline avant l\'outil',t:"Le CRM le plus sophistique du monde ne sert a rien s'il n'est pas rempli avec constance. Mieux vaut un simple tableau Google Sheets rempli religieusement apres chaque appel qu'un CRM avec intelligence artificielle integree que tu ouvres une fois par semaine. Choisis l'outil le plus simple qui te permettra de tenir cette discipline sur la duree."},scripts:null},
{n:'03',tc:'g',tag:'Performance',t:"Analyser tes appels",i:"Les closers qui progressent le plus vite ne sont pas ceux qui font le plus d'appels — ce sont ceux qui réécoutent leurs appels avec la bonne méthode. Reecouter un appel n'est pas un exercice pour se juger ou se flageller sur ses erreurs. C'est un exercice de calibrage technique, exactement comme un sportif de haut niveau qui visionne les matchs pour corriger un geste precis, pas pour se sentir mal.\n\nUn repere simple pour juger la qualité globale d'un appel de découverte : le ratio de parole devrait tourner autour de 30% pour toi et 70% pour le prospect. Si tu parles plus que ça, tu es probablement en train de pitcher au lieu de découvrir — et un prospect qui parle peu se sent moins engage dans la conversation, donc moins engage dans la décision finale.",pts:[{c:'g',b:'Les 6 questions de debrief',t:" : apres chaque réécoute, pose-toi systématiquement ces 6 questions — Quel etait mon état interne avant et pendant l'appel ? Quel schema psychologique ai-je détecte chez le prospect ? A quel moment ai-je contredit ou devie de ma propre méthode ? Quelle anomalie ou incoherence ai-je remarquee dans le discours du prospect sans la creuser sur le moment ? Quelle est la variable la plus faible de cet appel (découverte trop rapide, silence non tenu, pitch trop long) ? Et enfin, quelle a ete la petite flamme — le moment ou quelque chose a vraiment bien fonctionne, que je dois reproduire ?"},{c:'g',b:'Le ratio de parole comme indicateur',t:" : viser 30% toi / 70% prospect pendant la phase de découverte n'est pas une règle absolue a suivre au pourcentage pres, mais un signal d'alarme utile. Si tu te retrouves systématiquement au-dessus de 50%, c'est le signe que tu expliques au lieu de faire parler — et un prospect qui n'a pas suffisamment verbalise sa propre douleur n'aura pas la même conviction au moment de décider."},{c:'g',b:'Outils pour analyser sans y passer des heures',t:" : des outils comme Fathom, Fireflies.ai ou Otter.ai enregistrent et transcrivent automatiquement tes appels (avec le consentement du prospect), et certains calculent directement ton ratio de parole et identifient les moments de silence. Ça t'evite de réécouter integralement chaque appel a la main — tu peux cibler directement les passages ou l'appel a bascule, en positif comme en negatif."},{c:'g',b:'Frequence recommandee',t:" : tu n'as pas besoin de debriefer tous tes appels au même niveau de detail. Fais le debrief rapide de 10 minutes (voir chapitre precedent) systématiquement apres chaque appel, mais reserve l'analyse complète avec réécoute et les 6 questions pour 2 a 3 appels significatifs par semaine — en particulier ceux ou tu as senti que quelque chose n'allait pas, ou au contraire ceux qui se sont exceptionnellement bien passes."}],ex:{l:'Exercice — Ta prochaine réécoute',t:"Choisis ton dernier appel qui ne s'est pas termine par un oui clair. Reecoute-le entièrement une fois sans rien noter, juste pour l'impression générale. Puis réécoute-le une seconde fois avec les 6 questions de debrief sous les yeux, en notant tes réponses. Compare ton impression de la première écoute avec ce que l'analyse structuree fait vraiment ressortir."},gold:{l:'Le but n\'est jamais de se juger',t:"Un closer qui réécoute ses appels pour se sentir coupable abandonne cet exercice au bout de quelques semaines, parce que c'est douloureux sans être productif. Un closer qui les réécoute pour calibrer un geste precis, comme un sportif visionne ses matchs, continue sur des annees — parce que chaque réécoute lui donne une amelioration concrète et mesurable, pas juste un sentiment desagreable."},scripts:null},
{n:'04',tc:'g',tag:'Leadership',t:"Passer au niveau superieur — pourquoi ça ne s'arrête jamais",i:"A ce stade de la formation, tu sais diriger un appel : tu connais la structure, tu sais gerer les objections, tu comprends les profils psychologiques, tu as ta méthode de suivi post-appel et ton CRM pour progresser. La question naturelle qui se pose alors est simple : et maintenant, qu'est-ce qui se passe ?\n\nLa réponse honnête est que ça ne s'arrête pas. Tu ne peux jamais arriver a un point ou tu te dis \\\"c'est bon, je sais\\\". Pas parce que la formation serait incomplete, mais parce que le metier lui-même ne reste jamais fixe. Le closing evolue, le marche evolue, et surtout, le prospect en face de toi n'est plus le même qu'il y a deux ans. Les objections changent, les canaux d'acquisition changent, la mefiance ou la receptivite des prospects face au demarchage evolue constamment avec les tendances du marche et l'exposition croissante des gens a des techniques de vente de plus en plus visibles.\n\nDans ce contexte, il n'existe pas de statu quo. Soit tu continues a t'entraîner, a te former et a affiner ta pratique, et tu progresses avec le marche. Soit tu t'arrêtes de te former en te reposant sur ce que tu sais deja, et mecaniquement, tu regresses par rapport a un marche qui, lui, continue d'avancer. Il n'y a pas de place pour rester simplement stable indefiniment dans ce metier.",pts:[{c:'g',b:'Pourquoi le marche du closing bouge constamment',t:" : les prospects d'aujourd'hui ont ete exposes a des centaines d'appels de vente, de sequences email et de pitchs — leur niveau de mefiance et leur capacité a détecter une technique \\\"scriptee\\\" a fortement augmente. Ce qui fonctionnait il y a deux ou trois ans peut sonner faux ou manipulateur aujourd'hui. Rester a jour sur ces evolutions n'est pas un luxe, c'est une nécessité de survie professionnelle."},{c:'g',b:'Se spécialiser pour que le marche te trouve',t:" : une fois les fondamentaux solides, la spécialisation dans une ou deux niches precises te permet de devenir une reference reconnue plutot qu'un généraliste parmi d'autres. A terme, c'est cette spécialisation qui fait que les opportunités viennent a toi plutot que l'inverse."},{c:'g',b:'Le personal branding comme accelerateur',t:" : partager du contenu (LinkedIn ou autre canal pertinent pour ta niche), documenter tes reussites et tes apprentissages, construire une preuve sociale visible — tout ça accelere fortement ta capacité a être trouve et sollicite, plutot que de devoir constamment prospecter activement comme au debut de ton parcours."},{c:'g',b:'Le mentoring comme outil de maitrise',t:" : enseigner ce que tu sais a d'autres closers, même informellement, t'oblige a clarifier et structurer ta propre comprehension. Tu ne peux pas expliquer correctement une technique que tu ne maitrises qu'a moitie — le mentoring est donc autant un outil de progression pour toi qu'un service rendu a l'autre."},{c:'g',b:'Continuer a se former au-dela de cette formation',t:" : cette formation te donne des fondations solides, mais elle n'est pas une fin en soi. Se former en continu — que ce soit par la pratique reflexive (voir les chapitres precedents), par le mentoring, ou par des accompagnements complementaires spécialisés — fait partie integrante du metier. Le dernier chapitre de cette formation (« Et maintenant ? ») revient en detail sur les options concrètes pour continuer a progresser au-dela de ce programme."}],ex:{l:'Question finale',t:"Dans 12 mois, tu veux voir que tu as vraiment commence a construire ta carrière de closer — ou que tu es encore en train de te préparer a commencer ? La difference entre ces deux scenarios ne se joue pas dans ce que tu sais aujourd'hui, mais dans ce que tu vas continuer a pratiquer et apprendre a partir de maintenant."},gold:{l:'Le principe qui resume ce chapitre',t:"Le meilleur closing ne se sent jamais — le prospect a l'impression d'avoir décide seul. Cette maitrise-la ne s'obtient pas en terminant une formation, elle se construit sur la duree, appel apres appel, debrief apres debrief. Cette formation t'a donne la structure. Ce que tu en fais a partir de maintenant, appel apres appel, est entièrement entre tes mains."},scripts:null}
]}
,
12:{cat:'Bonus',title:"Et maintenant <span class='ap'>?</span>",desc:"La formation touche a sa fin. Ce que tu en fais a partir d'ici t'appartient — 3 chemins possibles, aucun n'est le seul bon choix.",
chs:[
{n:'∞',tc:'p',tag:'Et maintenant',t:"L'evolution ne s'arrête jamais — ce que tu fais de tout ça t'appartient",i:"Tu es arrive au bout de cette formation. Ce que tu en as retire — la structure d'appel, les neurosciences, la lecture des profils, le traitement des objections, le follow-up, la construction de ton pipeline — t'appartient desormais complètement. Personne ne peut te l'enlever.\n\nMais rappelle-toi ce qui a deja ete dit dans le module precedent : ce metier n'accepte pas le statu quo. Le marche du closing evolue, le prospect en face de toi evolue, et la seule vraie question qui se pose a partir de maintenant est celle-ci — est-ce que tu continues a evoluer avec lui, ou est-ce que tu t'arrêtes ici et tu regresses mecaniquement par rapport a un marche qui, lui, continue d'avancer ?\n\nIl y a trois chemins possibles a partir d'ici, et aucun n'est le \\\"bon\\\" chemin universel — seulement celui qui te correspond le mieux, aujourd'hui. Mais quel que soit le chemin choisi, l'idee reste la même : continuer a s'entraîner, continuer a se former, continuer a chercher la performance. C'est ce qui separe un closer qui dure dans ce metier d'un closer qui s'essouffle apres quelques mois.\n\nLe premier chemin, c'est de prendre ton envol complètement seul, en t'entretenant par tes propres moyens — la pratique reflexive, ton CRM, tes debriefs. Le deuxieme, c'est de continuer a te former en autonomie avec des ressources complementaires spécialisées. Le troisieme, c'est de rester accompagne directement par moi, de façon ponctuelle ou plus structuree. Aucun n'est superieur aux autres — seulement le fait de ne jamais complètement s'arrêter d'apprendre l'est.",pts:[{c:'p',b:'Chemin 1 — Tu prends ton envol en autonomie totale',t:" : tu as les outils. Tu continues seul, tu appliques la méthode, tu debriefes tes appels avec ton CRM, et tu progresses a ton propre rythme. Rien ne t'y oblige, mais rien ne t'en empeche non plus — c'est une option pleinement respectable, a condition de rester rigoureux sur la pratique reflexive vue dans le module precedent."},{c:'p',b:'Chemin 2 — Tu continues a te former avec des ressources complementaires',t:" : se former en continu ne signifie pas forcement rester avec moi. Des accompagnements complementaires spécialisés existent pour continuer a progresser une fois les bases de cette formation acquises. A titre d'exemple, l'accompagnement Sales Detox est une ressource pertinente pour continuer a te challenger et a affiner ta pratique dans la duree : https://www.skool.com/the-sales-detox/about?ref=fa9ce0c7a83c4b79991a2a59e46a8c61"},{c:'p',b:'Chemin 3 — Tu restes accompagne par moi, par intermittence',t:" : tu peux prendre une heure de coaching ponctuelle des que tu en ressens le besoin — pour debriefer un appel difficile, debloquer une periode de stagnation, ou simplement avoir un regard exterieur sur ta pratique. 1 heure de coaching individuel : 100€. Si tu fais deja partie d'un accompagnement en cours, ce tarif passe a 60€ (-40%)."},{c:'p',b:'Chemin 3 (suite) — Un suivi plus structure avec moi',t:" : pour aller plus loin et plus vite, un pack de 10 heures de coaching individuel est disponible a 500€ (-50% par rapport au tarif unitaire, en remise d'engagement sur le volume). Pour un accompagnement encore plus complet avec un rythme hebdomadaire regulier sur la duree, le mentoring complet — 2 heures de coaching par semaine pendant 3 mois — reste disponible a 2000€."},{c:'p',b:'Ce qui ne change pas, quel que soit ton choix',t:" : mon intention n'a jamais ete de te faire depenser de l'argent le plus longtemps possible. Elle a toujours ete de t'aider a devenir un closer competent, honnête, et capable de faire prendre aux gens des décisions qui sont reellement dans leur intérêt. Si cette formation t'a suffi pour ça, tant mieux. Si tu veux continuer a être accompagne — par moi ou par une autre ressource — la seule chose qui compte est que tu ne t'arrêtes pas d'apprendre."}],ex:null,gold:{l:'Une dernière chose',t:"Le closing, au fond, ce n'est pas un metier de manipulation — c'est un metier d'aide a la décision. Si tu retiens une seule chose de tout ce programme, que ce soit celle-la. Merci d'être alle jusqu'au bout — et n'oublie jamais que dans ce metier, on evolue ou on regresse. Il n'y a pas de troisieme option."},scripts:null}
]}};
var ANC=[
{n:'00',tc:'p',tag:'Fondations',t:"Comprendre l'ancrage",i:"L'ancrage crée une tension entre ce que le prospect a dit être et ce qu'il est tente de faire. C'est lui qui resout cette tension — en ta faveur.",pts:[{c:'p',b:'Engagement (Cialdini)',t:" : une fois qu'une personne se definit à voix haute, le cerveau protege cette image."},{c:'p',b:'Dissociation sociale',t:" : le cerveau definit 'qui je suis' autant par opposition que par similitude."},{c:'p',b:'Synchronie neuronale',t:" : quand tu exposes ta vulnérabilité, la méfiance baisse."}],ex:{l:'Règle absolue',t:"Un ancrage mal incarne fait l'effet inverse. Il doit sonner naturel — jamais calcule."},gold:{l:'Important',t:"Un ancrage ne se cite jamais explicitement en closing. Il se reactive implicitement : 'Est-ce que la, c'est aligne pour toi ?'"},scripts:null},
{n:'01',tc:'p',tag:'Format 1 - Connexion',t:"Ancre directe — le signal identitaire",i:"Tu poses une question qui force le prospect a se définir lui-même. Peu importe la réponse — tu gagnes soit une ancre reutilisable, soit une information diagnostique precieuse.",pts:[{c:'p',b:'Timing optimal',t:" : connexion ou début de diagnostic."},{c:'p',b:'Profil adapte',t:" : fonctionne bien avec les profils D et I."},{c:'p',b:'Lien découverte',t:" : la réponse oriente immédiatement la suite."}],ex:null,gold:null,scripts:'s1'},
{n:'02',tc:'t',tag:'Format 2 - Diagnostic',t:"Ancre par contraste — la dissociation sociale",i:"Tu decris un groupe négatif sans parler de lui. Il se dissocie activement. Si ensuite il hesite, c'est lui qui doit gérer l'incoherence.",pts:[{c:'p',b:'Timing optimal',t:" : fin de diagnostic ou transition vers la présentation."},{c:'p',b:'Mecanisme',t:" : le prospect ne peut plus objecter de la même façon."},{c:'p',b:'Variante découverte',t:" : 'La plupart des gens dans cette situation ont essaye 2-3 choses seuls... 6 mois plus tard au même endroit. T'as l'impression d'être dans ce pattern ?'"}],ex:null,gold:null,scripts:'s2'},
{n:'03',tc:'r',tag:'Format 3 - Transition',t:"Auto-admission — désarmer l'amygdale",i:"Tu exposes ta vulnérabilité passee en premier. Ca desarme la resistance. Condition : doit être vrai.",pts:[{c:'p',b:'Timing optimal',t:" : transition avant le pitch. Jamais en milieu de diagnostic."},{c:'p',b:'Profil adapte',t:" : particulierement efficace avec les profils Mefiants et Stables."},{c:'p',b:'Condition',t:" : doit être vrai. Une auto-admission fabriquee se détecte immédiatement."}],ex:null,gold:null,scripts:'s3'},
{n:'04',tc:'p',tag:'Boite a outils',t:"Scripts complets — les 3 formats",i:"Le bon format, au bon moment, avec le bon profil. Les 3 formats se combinent dans un même appel.",pts:[{c:'p',b:'Combinaison optimale',t:" : Phase 1 -> Ancre directe. Fin diagnostic -> Ancre contraste. Avant pitch -> Auto-admission."}],ex:{l:'Sequence complète',t:"Phase 1 -> signal identitaire. Phase 3-4 -> dissociation + tension. Avant pitch -> espace de vérité. Closing -> 'Est-ce que la, c'est aligne pour toi ?'"},gold:{l:'A ne jamais faire',t:"2 ancrages consecutifs. Auto-admission fabriquee. Citer explicitement l'ancre en closing."},scripts:null}
];

function normSearch(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function doSearch(){
  var el=document.getElementById('chSearch');if(!el)return;
  var q=normSearch(el.value.trim());
  var box=document.getElementById('searchResults');if(!box)return;
  if(!q){box.style.display='none';box.innerHTML='';return;}
  var matches=SEARCH_IDX.filter(function(it){return normSearch(it.tag).indexOf(q)!==-1||normSearch(it.t).indexOf(q)!==-1;}).slice(0,8);
  if(!matches.length){box.innerHTML='<div class="sr-empty">Aucun résultat.</div>';box.style.display='block';return;}
  box.innerHTML=matches.map(function(m){return '<div class="sr-item" onclick="goToChapter('+m.mi+','+m.ci+','+(m.isA?'true':'false')+')"><div class="sr-mod">'+m.mtitle+'</div><div class="sr-t">'+m.t+'</div></div>';}).join('');
  box.style.display='block';
}

var MOD4_QUIZ_HTML='<div class="qz-wrap"><div class="qz-header"><div class="qz-title">Auto-evaluation — Structure de l\'appel</div><div class="qz-desc">8 questions pour verifier ce que tu retiens du module. Ceci ne modifie pas ta progression — c\'est uniquement pour toi.</div></div><div class="qz-score-bar" id="qz-score-bar" style="display:none"><span id="qz-score-text"></span></div><div id="qz-questions"><div class="qz-q" id="qz-q-0"><div class="qz-qnum">Question 1 / 8</div><div class="qz-qtext">Le mirroring consiste a :</div><div class="qz-opts"><div class="qz-opt" data-correct="1" onclick="qzAnswer(this,0)">Repeter les 2-3 derniers mots importants du prospect sur un ton legerement interrogatif</div><div class="qz-opt" data-correct="0" onclick="qzAnswer(this,0)">Repeter mot pour mot tout ce que dit le prospect</div><div class="qz-opt" data-correct="0" onclick="qzAnswer(this,0)">Reformuler completement la phrase du prospect avec tes propres mots</div><div class="qz-opt" data-correct="0" onclick="qzAnswer(this,0)">Terminer les phrases du prospect a sa place</div></div><div class="qz-explain" id="qz-explain-0">Le mirroring reprend seulement les derniers mots cles, sur un ton interrogatif — ça enclenche un reflexe naturel de clarification chez le prospect, sans jamais paraphraser.</div></div><div class="qz-q" id="qz-q-1"><div class="qz-qnum">Question 2 / 8</div><div class="qz-qtext">Pendant la Phase 2 (decouverte, 5-15 min), l\'objectif principal est de :</div><div class="qz-opts"><div class="qz-opt" data-correct="0" onclick="qzAnswer(this,1)">Presenter rapidement l\'offre pour ne pas perdre de temps</div><div class="qz-opt" data-correct="1" onclick="qzAnswer(this,1)">Cerner la situation actuelle et les fausses croyances du prospect</div><div class="qz-opt" data-correct="0" onclick="qzAnswer(this,1)">Annoncer le prix pour tester sa reaction</div><div class="qz-opt" data-correct="0" onclick="qzAnswer(this,1)">Convaincre le prospect qu\'il a besoin d\'aide</div></div><div class="qz-explain" id="qz-explain-1">La Phase 2 sert a comprendre ou en est reellement le prospect et quelles croyances erronees freinent sa progression — pas encore a vendre quoi que ce soit.</div></div><div class="qz-q" id="qz-q-2"><div class="qz-qnum">Question 3 / 8</div><div class="qz-qtext">Le "cout de l\'inaction" (Phase 4) sert principalement a :</div><div class="qz-opts"><div class="qz-opt" data-correct="0" onclick="qzAnswer(this,2)">Faire peur au prospect pour le forcer a signer</div><div class="qz-opt" data-correct="1" onclick="qzAnswer(this,2)">Faire verbaliser par le prospect lui-meme ce que lui coute de ne rien changer</div><div class="qz-opt" data-correct="0" onclick="qzAnswer(this,2)">Justifier le prix de l\'offre</div><div class="qz-opt" data-correct="0" onclick="qzAnswer(this,2)">Remplacer la phase de decouverte</div></div><div class="qz-explain" id="qz-explain-2">Le cout de l\'inaction n\'est puissant que si c\'est le prospect qui le formule lui-meme — ce n\'est jamais toi qui dois lister ce qu\'il perd a ne rien faire.</div></div><div class="qz-q" id="qz-q-3"><div class="qz-qnum">Question 4 / 8</div><div class="qz-qtext">Dans la Phase 5a, la "prescription" (le pitch) doit avant tout :</div><div class="qz-opts"><div class="qz-opt" data-correct="0" onclick="qzAnswer(this,3)">Presenter un maximum de fonctionnalites de l\'offre</div><div class="qz-opt" data-correct="1" onclick="qzAnswer(this,3)">Appartenir au prospect — reprendre ses mots, ses objectifs, sa situation</div><div class="qz-opt" data-correct="0" onclick="qzAnswer(this,3)">Etre identique a chaque appel pour rester efficace</div><div class="qz-opt" data-correct="0" onclick="qzAnswer(this,3)">Se concentrer sur le prix le plus vite possible</div></div><div class="qz-explain" id="qz-explain-3">Un pitch qui "appartient" au prospect reprend exactement ce qu\'il a dit pendant la decouverte — c\'est ce qui fait qu\'il se reconnait dans la solution plutot que de se sentir vendu.</div></div><div class="qz-q" id="qz-q-4"><div class="qz-qnum">Question 5 / 8</div><div class="qz-qtext">Face a une objection prix qui resiste apres la premiere revalidation, la premiere etape consiste a :</div><div class="qz-opts"><div class="qz-opt" data-correct="0" onclick="qzAnswer(this,4)">Proposer immediatement un paiement echelonne</div><div class="qz-opt" data-correct="0" onclick="qzAnswer(this,4)">Baisser le prix pour debloquer la vente</div><div class="qz-opt" data-correct="1" onclick="qzAnswer(this,4)">Separer le prix de la peur en reancrant sur son objectif precis</div><div class="qz-opt" data-correct="0" onclick="qzAnswer(this,4)">Changer de sujet et revenir au prix plus tard</div></div><div class="qz-explain" id="qz-explain-4">Avant de parler chiffres, il faut identifier si le blocage est reellement financier ou s\'il s\'agit d\'une peur non exprimee — traiter la peur d\'abord change completement la suite de la conversation.</div></div><div class="qz-q" id="qz-q-5"><div class="qz-qnum">Question 6 / 8</div><div class="qz-qtext">La disqualification (Phase 6) sert a :</div><div class="qz-opts"><div class="qz-opt" data-correct="0" onclick="qzAnswer(this,5)">Rejeter le plus de prospects possible pour paraitre selectif</div><div class="qz-opt" data-correct="1" onclick="qzAnswer(this,5)">Reconnaitre honnetement quand un prospect n\'est pas encore pret, plutot que de forcer une vente</div><div class="qz-opt" data-correct="0" onclick="qzAnswer(this,5)">Uniquement pour les prospects qui n\'ont pas de budget</div><div class="qz-opt" data-correct="0" onclick="qzAnswer(this,5)">Remplacer l\'annonce du prix</div></div><div class="qz-explain" id="qz-explain-5">Vendre a quelqu\'un qui n\'est objectivement pas pret cree un client qui echoue ou demande un remboursement. La disqualification protege autant le prospect que ta reputation.</div></div><div class="qz-q" id="qz-q-6"><div class="qz-qnum">Question 7 / 8</div><div class="qz-qtext">Concernant le paiement (Phase 7), la bonne pratique est de :</div><div class="qz-opts"><div class="qz-opt" data-correct="0" onclick="qzAnswer(this,6)">Toujours proposer le paiement en plusieurs fois en premier</div><div class="qz-opt" data-correct="1" onclick="qzAnswer(this,6)">Laisser le prospect verbaliser lui-meme ses conditions avant de reveler les options de paiement</div><div class="qz-opt" data-correct="0" onclick="qzAnswer(this,6)">Eviter d\'en parler pour ne pas casser l\'ambiance de l\'appel</div><div class="qz-opt" data-correct="0" onclick="qzAnswer(this,6)">Toujours exiger le paiement integral immediat</div></div><div class="qz-explain" id="qz-explain-6">Faire dire au prospect son propre nombre de fois ideal avant de reveler le paiement echelonne le met en position de negocier avec lui-meme, pas avec toi.</div></div><div class="qz-q" id="qz-q-7"><div class="qz-qnum">Question 8 / 8</div><div class="qz-qtext">Le mirroring est decrit comme un outil :</div><div class="qz-opts"><div class="qz-opt" data-correct="0" onclick="qzAnswer(this,7)">Utilise uniquement en debut d\'appel pour creer la connexion</div><div class="qz-opt" data-correct="0" onclick="qzAnswer(this,7)">Reserve aux prospects difficiles</div><div class="qz-opt" data-correct="1" onclick="qzAnswer(this,7)">Transversal, utilisable a n\'importe quelle phase de l\'appel</div><div class="qz-opt" data-correct="0" onclick="qzAnswer(this,7)">A eviter avec les profils de type D (dominant)</div></div><div class="qz-explain" id="qz-explain-7">Le mirroring traverse tout l\'appel : connexion initiale, decouverte, traitement d\'objection — c\'est un des rares outils utilisable a chaque etape sans exception.</div></div></div></div>';
var QZ_ANSWERED={};
function qzAnswer(el,qi){
  if(QZ_ANSWERED[qi])return;
  QZ_ANSWERED[qi]=true;
  var isCorrect=el.dataset.correct==='1';
  var opts=el.parentElement.querySelectorAll('.qz-opt');
  opts.forEach(function(o){
    o.classList.add('qz-disabled');
    if(o.dataset.correct==='1')o.classList.add('qz-correct');
  });
  if(!isCorrect)el.classList.add('qz-wrong');
  var explain=document.getElementById('qz-explain-'+qi);
  if(explain)explain.classList.add('show');
  qzUpdateScore();
}
function qzUpdateScore(){
  var total=Object.keys(QZ_ANSWERED).length;
  var allQ=document.querySelectorAll('.qz-q').length;
  if(total<allQ)return;
  var correct=0;
  document.querySelectorAll('.qz-q').forEach(function(qEl){
    var correctOpt=qEl.querySelector('.qz-opt.qz-correct');
    var wrongClicked=qEl.querySelector('.qz-opt.qz-wrong');
    if(correctOpt && !wrongClicked)correct++;
  });
  var bar=document.getElementById('qz-score-bar'),txt=document.getElementById('qz-score-text');
  if(bar&&txt){
    bar.style.display='block';
    var pct=Math.round(correct/allQ*100);
    var msg=pct>=80?'Excellent — tu maitrises bien cette phase.':pct>=50?'Pas mal — relis les chapitres ou tu as hesite.':'Cette phase merite une relecture complete avant de passer a la suite.';
    txt.textContent='Score : '+correct+' / '+allQ+' ('+pct+'%) — '+msg;
    bar.scrollIntoView({behavior:'smooth',block:'center'});
  }
}

    if(ch.tbox){h+='<div class="tbox"><div class="tl">'+ch.tbox.l+'</div>';ch.tbox.pts.forEach(function(q){h+='<div class="qitem">'+q+'</div>';});h+='</div>';}

  if(MOD_PDFS[mi]){

  if(mi===4)h+=MOD4_QUIZ_HTML;
  return h;
}

var exs={};
exs[1]={t:"Exercice — Mindset & Identite",s:"Le mindset ne se lit pas. Il se pratique. Ces exercices sont a faire avant tes appels, pas après.",steps:[{t:"Le journal de débrief post-appel",d:"Apres chaque appel, prends 10 minutes. Reponds par écrit a ces 3 questions : Quel était mon état interne avant de décrocher ? A quel moment ai-je senti une pression sur le résultat ? Qu'est-ce que j'aurais fait differemment si j'etais en puissance calme ? Fais ça sur 10 appels consecutifs. Tu vas voir des patterns emerger."},{t:"L'exercice du détachement avant l'appel",d:"Avant ton prochain appel, ecris sur un papier : 'Je suis indifferent au résultat de cet appel. Mon seul objectif est de comprendre cette personne.' Pose le papier. Lis-le à voix haute. Puis decroche. Observe comment ça change ta façon d'écouter et de répondre."},{t:"Le rituel pre-appel 14 jours de suite",d:"Pendant 14 jours, applique le protocole complet avant chaque appel sans exception : coherence cardiaque 3 min + intention à voix haute + lecture du profil. Note après chaque appel si tu as ressenti une difference. La constance sur 14 jours crée un ancrage neurologique reel."}],checks:["J'ai fait le journal de débrief sur 5 appels consecutifs","J'ai identifié mes 2 principaux déclencheurs de mode besoin","J'ai applique le rituel pre-appel 14 jours de suite","J'ai enregistré un appel et évalue mon ratio de parole (cible : 30/70)","J'ai identifié un moment ou j'ai tue un silence — et ce que j'aurais pu faire","J'ai demande un retour a mon mentor sur mon état interne sur un appel"],rp:{sc:"Scenario : ton mentor joue un prospect qui te pose des questions difficiles sur le prix et les garanties des les 2 premières minutes — avant que tu aies eu le temps de faire de la découverte. Ton objectif : maintenir ta posture, ne pas ceder a la pression, reorienter vers la découverte sans brusquer.",cr:["As-tu maintenu un rythme calme et une voix posée ?","As-tu resiste a la tentation de pitcher trop tot ?","Comment as-tu gere la question sur le prix avant d'avoir fait la découverte ?","As-tu tenu les silences sans les combler ?","Ton état interne était-il visible dans tà voix ?"]}};
exs[2]={t:"Exercice — Neurosciences appliquees",s:"La theorie ne sert a rien si elle ne change pas ce que tu fais sur l'appel. Ces exercices ancrent les concepts dans la pratique.",steps:[{t:"Cartographier le cadre cognitif d'un prospect reel",d:"Sur ton prochain appel, applique les 3 questions de diagnostic dans l'ordre exact : 1. Qu'est-ce que tu as déjà essaye ? 2. Qu'est-ce qui a bloque ? 3. Comment tu saurais qu'une décision est la bonne pour toi ? Note les réponses mot pour mot. Apres l'appel, identifié la croyance centrale derriere chaque réponse."},{t:"L'exercice de l'aversion a la perte",d:"Sur 3 appels, note le moment exact ou tu utilises une formulation orientée gain vs une formulation orientée perte. Compare les reactions du prospect dans les deux cas. La difference de reaction te montrera concrètement pourquoi 'qu'est-ce que ça te coute de rester la' fonctionne mieux que 'imagine ce que tu peux gagner'."},{t:"Ecouter les variables non-verbales sur un enregistrement",d:"Enregistre un de tes appels. Reecoute-le en te concentrant uniquement sur les variables non-verbales : ton rythme, tes silences, ton intonation en fin de phrase. Pas sur le contenu — sur la forme. Demande a ton mentor d'écouter 5 minutes et de te donner un retour sur ta posture vocale uniquement."}],checks:["J'ai applique les 3 questions de diagnostic dans l'ordre sur 3 appels","J'ai identifié la croyance centrale derriere au moins une objection","J'ai compare formulation gain vs formulation perte sur 2 appels","J'ai écoute un enregistrement en mode variables non-verbales uniquement","J'ai recu un retour de mon mentor sur ma posture vocale","J'ai identifié le schéma cognitif dominant d'un prospect en moins de 5 minutes"],rp:{sc:"Scenario : ton mentor joue un prospect qui arrive avec un cadre cognitif négatif très marque ('j'ai déjà essaye ce genre de chose et ça n'a jamais marche'). Ton objectif : cartographier son cadre, introduire une anomalie, et proposer un nouveau schéma — sans jamais contredire frontalement.",cr:["As-tu validé son expérience avant d'essayer de deplacer le cadre ?","As-tu trouve une anomalie pertinente dans son propre discours ?","As-tu utilisé la question 'qu'est-ce qui t'a amene a accepter cet appel aujourd'hui' ?","As-tu evite de sur-expliquer ou d'argumenter ?","Le prospect avait-il l'impression d'avoir fait le chemin lui-même ?"]}};
exs[3]={t:"Exercice — Detection de profils DISC + PCM",s:"La détection de profil, ça se travaille. L'objectif : identifier le canal en moins de 3 minutes, automatiquement.",steps:[{t:"Le jeu de la détection en 60 secondes",d:"Sur tes 10 prochains appels, consacre les 60 premières secondes uniquement a détecter le profil. Note : vitesse de parole, 1er sujet aborde, ton général. Ecris le profil probable avant de continuer. Apres l'appel, validé si tu avais raison. Objectif : 7 bonnes predictions sur 10 appels."},{t:"Adapter son canal en temps reel",d:"Sur un appel, si tu sens que le prospect se ferme (réponses courtes, monosyllabes, ton distant) — c'est que tu utilises le mauvais canal. Fais une pause. Identifie quel canal tu utilises. Passes au canal oppose. Note ce qui change dans la dynamique de la conversation."},{t:"Le roleplay de profils extrêmes",d:"Demande a ton mentor de jouer successivement un Dominant pur (impatient, coupe la parole, demande le ROI direct) et un Stable pur (lent, parle de sa famille, cherche la sécurité). Pratique le changement de canal entre les deux. L'objectif : sentir la difference dans ton corps, pas juste la comprendre intellectuellement."}],checks:["J'ai détecte correctement le profil sur 7 appels sur 10","J'ai utilisé le canal directif sur un profil D et note la reaction","J'ai utilisé le canal nourricier sur un profil S et note la reaction","J'ai identifié un prospect en stress niveau 2 et adapte mon approche","J'ai fait le roleplay de profils extrêmes avec mon mentor","Je peux nommer le canal de communication de chaque profil sans hesiter"],rp:{sc:"Roleplay en 2 parties. Partie 1 : ton mentor joue un Analytique en stress (beaucoup de questions, ton critique, 'j'ai besoin de plus d'informations'). Partie 2 : il change de profil et joue un Empathique en stress (très doux, dit oui a tout mais n'ose pas s'engager). Tu dois détecter le changement et adapter ton canal en temps reel.",cr:["As-tu détecte le profil dans les 2-3 premières minutes ?","As-tu utilisé le bon canal des le début ou tu as du corriger en cours ?","As-tu gere le stress du prospect sans perdre ta posture ?","As-tu détecte le changement de profil entre les deux parties ?","Quel signal t'a indique que tu utilisais le mauvais canal ?"]}};
exs[4]={t:"Exercice — Structure de l'appel",s:"La structure s'automatise avec la répétition. L'objectif : que chaque phase soit naturelle, pas mecanique.",steps:[{t:"L'appel en mode observation pure",d:"Sur ton prochain appel, fixe-toi un seul objectif : ne rien dire pendant les 5 premières minutes sauf des questions ouvertes et du mirroring. Pas d'explication, pas de pitch, pas de commentaire. Juste des questions et du silence. Note ce que le prospect revele spontanement quand tu lui laisses vraiment l'espace."},{t:"Chronometrer chaque phase sur 3 appels",d:"Sur 3 appels, note l'heure de début de chaque phase : connexion, découverte, solutions, coût d'inaction, pitch, closing. Compare avec la structure cible (0-5 / 5-25 / 25-40 / 40-55 min). Si une phase est trop courte, tu sais exactement ou travailler."},{t:"Maitriser la transition découverte vers pitch",d:"Pratique cette phrase jusqu'a ce qu'elle soit naturelle : 'D'après tout ce que tu m'as partage — tu veux [X], tu te sens bloque par [Y], et ce que tu ne veux plus c'est [Z]. Est-ce que je me trompe quelque part ?' Silence. Puis : 'Est-ce que tu penses qu'on peut t'aider a aller la ?' C'est la transition la plus importante de l'appel."}],checks:["J'ai fait 3 appels en chronometrant chaque phase","J'ai tenu 5 minutes de questions et mirroring sans pitcher sur un appel","J'ai utilisé la transition découverte-pitch exacte sur 3 appels","Mon ratio de parole est en dessous de 40% sur au moins 2 appels","J'ai tenu le silence après la question de fermeture au moins une fois","J'ai gere un non proprement et envoye le message de suivi 48h après"],rp:{sc:"Appel complet en roleplay — 45 minutes. Ton mentor joue un prospect interesse mais hesitant, avec une objection en fin d'appel ('j'ai besoin d'en parler a ma femme'). Tu dois passer par toutes les phases dans le bon ordre et dans les bons timings. L'évaluation porte sur la fluidite des transitions et la naturalite de chaque phase.",cr:["Les phases se sont-elles enchainees naturellement ou mecaniquement ?","As-tu respecte les timings approximatifs de chaque phase ?","La transition découverte-pitch était-elle fluide ?","As-tu tenu le silence après la fermeture ?","Comment as-tu traite l'objection 'j'en parle a ma femme' ?"]}};
exs[5]={t:"Exercice — Phase de découverte",s:"La découverte se pratique à part. C'est une competence en soi — pas juste une étape de l'appel.",steps:[{t:"L'exercice des 5 pourquoi sur un vrai prospect",d:"Sur ton prochain appel, choisis une réponse du prospect et applique les 5 pourquoi complets. 'J'ai pas le temps' -> 'Pas le temps pour quoi ?' -> réponse -> nouvelle question -> etc. Ne t'arrêtes pas avant le 4e ou 5e niveau. Note la difference entre la 1ere réponse et la 5e — c'est la vraie douleur."},{t:"La découverte sans jamais nommer la douleur",d:"Sur 3 appels, fixe-toi une règle : tu n'es pas autorise a nommer toi-même la douleur du prospect. Tu ne peux que poser des questions pour qu'il la nomme lui-même. Note combien de fois tu as eu envie de 'aider' en nommant — c'est exactement ce qu'il faut apprendre a retenir."},{t:"Le résumé-validation parfait",d:"Apres chaque découverte, fais le résumé-validation avec ses mots exacts — pas les tiens. Puis pose la question : 'Est-ce que je me trompe quelque part ?' Ecoute attentivement ce qu'il corrige. Ce qu'il corrige, c'est la vraie douleur. Note les corrections systématiquement."}],checks:["J'ai applique les 5 pourquoi complets sur au moins 2 appels","J'ai fait un appel entier sans nommer la douleur a sa place","J'ai utilisé les 5 categories de questions sur un même appel","J'ai fait un résumé-validation avec ses mots exacts sur 3 appels","J'ai utilisé les questions Momentum en fin de découverte","J'ai traite l'objection 'je vais me lancer seul' de façon preventive pendant la découverte"],rp:{sc:"Roleplay découverte pure — 20 minutes. Ton mentor joue un prospect qui a des réponses de surface ('ça va, c'est juste que je voudrais gagner plus'). Ton objectif : creuser jusqu'a la vraie douleur identitaire ou relationnelle. Tu n'as pas le droit de pitcher, pas le droit de parler du programme. Juste des questions et du mirroring.",cr:["As-tu atteint la 3e couche de la douleur (identitaire ou relationnelle) ?","As-tu evite de nommer la douleur a sa place ?","Le prospect avait-il l'impression d'avoir fait le chemin lui-même ?","As-tu utilisé des questions miroir efficacement ?","Quel moment du roleplay t'a paru le plus difficile — pourquoi ?"]}};
exs[6]={t:"Exercice — Fausses croyances & Objections",s:"Les objections se traitent en amont. Et quand elles arrivent quand même, elles se traitent avec méthode.",steps:[{t:"Cartographier tes 5 objections frequentes",d:"Fais la liste des 5 objections que tu entends le plus souvent. Pour chacune : identifié la vraie croyance derriere, formule la question d'accueil, la question de creusage, et le recadrage. Pas de script — des directions. Pratique chacune à voix haute jusqu'a ce que ça sonne naturel et non mecanique."},{t:"L'exercice du cadre des 3 temps",d:"Sur ton prochain appel qui contient une objection : applique le cadre des 3 temps en le nommant mentalement à chaque étape. 'La je suis en train d'accueillir.' 'La je creuse.' 'La je recadre.' Ca ralentit ton cerveau et evite de sauter directement au recadrage par réflexe conditionne."},{t:"Anticiper les objections pendant la découverte",d:"Sur tes 5 prochains appels, identifié dans la découverte les signaux qui annoncent une objection probable. Exemple : si le prospect mentionné qu'il a 'déjà essaye des trucs similaires' -> objection arnaque probable. Traite-la pendant la découverte, pas en fin d'appel."}],checks:["J'ai cartographie mes 5 objections frequentes avec le cadre des 3 temps","J'ai traite une objection sans me defendre et note la reaction du prospect","J'ai utilisé la question 'en dehors de ça, y'a-t-il autre chose ?' avant de traiter","J'ai anticipe et traite une objection pendant la découverte","J'ai fait une sortie propre sur un non et envoye le suivi 48h après","J'ai recu un retour de mon mentor sur mon traitement d'objection"],rp:{sc:"Scenario objections en cascade. Ton mentor sort 3 objections en sequence : 'c'est trop cher', puis 'j'ai besoin d'y réfléchir', puis 'je vais d'abord essayer seul'. Ton objectif : traiter chaque objection avec le cadre des 3 temps, sans jamais te defendre, et identifier la vraie objection derriere les trois de surface.",cr:["As-tu fait une pause avant de répondre à chaque objection ?","As-tu accueilli avant de creuser, et creuse avant de recadrer — dans cet ordre ?","As-tu identifié la vraie objection derriere les trois de surface ?","As-tu evite de te defendre ou de justifier le prix ?","La conversation restait-elle fluide ou sentait-on le traitement ?"]}};
exs[7]={t:"Exercice — Ferocite & Flow",s:"La performance ne s'improvise pas. Elle se construit par des habitudes precises qui tiennent dans le temps.",steps:[{t:"Construire ta liste toujours / jamais",d:"Prends 20 minutes. Ecris ta liste de ce que tu feras TOUJOURS (ritual pre-appel, débrief post-appel, etc.) et ta liste de ce que tu ne feras JAMAIS (checker les reseaux avant un appel, faire un appel sans préparation, etc.). Affiche ces listes. Evalue-toi chaque semaine sur les deux colonnes."},{t:"Le défi des 10 jours consecutifs",d:"Choisis une habitude de performance que tu veux ancrer : coherence cardiaque, meditation, débrief post-appel. Fais-la 10 jours de suite sans exception. Une seule. Pas plusieurs a la fois. La régularité sur une habitude vaut mieux que l'irregularite sur dix."},{t:"Tracker ton état de Flow",d:"Sur tes 10 prochains appels, note après chacun ton niveau de Flow sur 10 : etais-tu vraiment present ? As-tu eu des moments d'acuite ou tu sentais le prospect ? Note ce qui precedait les appels a Flow élève vs les appels a Flow bas."}],checks:["Ma liste toujours / jamais est ecrite et affichee","J'ai tenu une habitude 10 jours consecutifs sans exception","J'ai tracker mon état de Flow sur 10 appels","J'ai identifié ce qui crée mes états de Flow les plus élèves","J'ai mange le crapaud en premier pendant 5 jours consecutifs","J'ai fait un débrief écrit après chaque appel pendant 2 semaines"],rp:{sc:"Scenario de maintien sous pression. Ton mentor te fait faire 3 roleplays en sequence rapide (15 min chacun), sans pause. L'objectif : observer comment ta posture et ton énergie evoluent entre le 1er et le 3e. Sur le 3e, ton mentor joue un prospect difficile et agressif.",cr:["Ton état interne sur le 3e appel était-il comparable au 1er ?","Quels signaux indiquaient une baisse d'énergie ou de présence ?","As-tu maintenu ton rituel entre les appels ?","Comment tà voix et ton rythme ont-ils évolue ?","Qu'est-ce que tu ferais differemment pour maintenir ton état ?"]}};
exs[8]={t:"Exercice — Performer & Grandir",s:"La professionnalisation, ça se construit. Ces exercices sont operationnels — pas theoriques.",steps:[{t:"Construire ton CRM en 1h",d:"Ouvre un Google Sheets. Cree ces colonnes : Prenom | Source | Profil DISC | Statut | Date prochain contact | Objection principale | Notes débrief | Commission. Remplis-le avec tes 10 derniers prospects. Mets une prochaine action sur chacun. A partir d'aujourd'hui, chaque prospect a une prochaine action planifiee."},{t:"Le débrief structure sur 10 appels",d:"Sur tes 10 prochains appels, reponds par écrit aux 6 questions après chaque appel : Quel était mon état interne ? Quel schéma cognitif j'ai détecte ? Quand ai-je contredit le cadre ? Quelle anomalie aurait pu deplacer le schéma ? Sur quelle variable était ma plus grande lacune ? Quelle était la 'petite flamme' du prospect ?"},{t:"Contacter 5 infopreneurs cette semaine",d:"Pas la semaine prochaine. Cette semaine. Identifie 5 infopreneurs dans ta niche. Envoie un message court et direct : 'Je suis closer spécialisé en [niche]. J'aide les infopreneurs a convertir leurs prospects en clients. Est-ce que vous avez un besoin en ce moment ?' 5 messages, cette semaine, pas la suivante."}],checks:["Mon CRM est construit avec les bonnes colonnes","Chaque prospect dans mon CRM a une prochaine action planifiee","J'ai fait le débrief structure sur 5 appels consecutifs","J'ai contacte 5 infopreneurs cette semaine","J'ai enregistré et réécoute 3 de mes appels","Mon ratio de parole moyen sur 10 appels est en dessous de 40%"],rp:{sc:"Simulation de prospection. Ton mentor joue un infopreneur que tu contactes pour la première fois. Il est occupe, un peu sceptique, et te demande ce que tu vaux en 2 minutes. Ton objectif : te présenter sans pitcher ton programme, créer de la curiosite, et obtenir un appel de découverte.",cr:["As-tu evite de pitcher ton programme directement ?","As-tu crée de la curiosite plutot que de la conviction ?","As-tu obtenu un engagement pour un prochain echange ?","Ta présentation durait-elle moins de 2 minutes ?","Comment as-tu gere le scepticisme initial de l'infopreneur ?"]}};
exs[9]={t:"Exercice — Maitriser l'ancrage",s:"3 formats. 3 timings. Une seule règle : ça doit sonner naturel.",steps:[{t:"Ecris ton auto-admission vraie",d:"Qu'est-ce que tu pensais de ce business avant de le comprendre vraiment ? Si c'est fabrique, ça ne fonctionnera pas."},{t:"Teste les 3 formats sur un appel reel",d:"Ancre directe en ouverture. Ancre contraste en fin de diagnostic. Auto-admission avant le pitch."},{t:"Reactive l'ancre en closing",d:"Sans citer l'ancre : 'Est-ce que la, avec tout ce qu'on s'est dit, c'est aligne pour toi ?'"}],checks:["Mon auto-admission vraie est ecrite et testee","J'ai place une ancre directe en ouverture sur 3 appels","J'ai utilisé l'ancre contraste en fin de diagnostic","J'ai fait une auto-admission avant le pitch","J'ai reactive l'ancre implicitement en closing","J'ai enregistré et réécoute avec mon mentor"],rp:{sc:"Ton mentor joue un prospect méfiant qui dit 'j'ai besoin d'y réfléchir'. Tu dois avoir pose les 3 ancrages aux bons moments. L'évaluation porte sur le naturel, pas sur la technique.",cr:["L'ancre directe sonnait-elle naturelle ou calculee ?","L'ancre contraste a-t-elle crée une reaction visible ?","L'auto-admission était-elle vraie et incarnee ?","As-tu reactive l'ancre sans la citer ?","La tension interne était-elle palpable ?"]}};
exs[10]={t:"Exercice — Incarner les analogies",s:"Connaitre une image ne suffit pas. L'objectif : qu'elle sonne comme la tienne.",steps:[{t:"Memorise puis oublie le script",d:"Lis chaque analogie plusieurs fois. Puis ferme la page. Raconte-la avec tes mots. Si tu la recites mot pour mot, elle n'est pas encore incarnee."},{t:"Enregistre-toi en train de la poser",d:"Sur un roleplay ou un vrai appel. Reecoute : est-ce que ça sonne naturel ? Il y a du silence après ?"},{t:"Une analogie par semaine sur un appel reel",d:"Pas toutes a la fois. Une par semaine, sur le bon profil, au bon moment."}],checks:["J'ai reformule avec mes propres mots 3 analogies","J'ai enregistré l'une d'elles sur un appel reel","J'ai note la reaction du prospect après le silence","J'ai identifié quelle analogie fonctionne sur quel profil","J'ai demande un retour a mon mentor sur l'incarnation"],rp:{sc:"Roleplay : ton mentor donne une objection au hasard. Tu dois placer l'analogie adaptee, naturellement, sans l'annoncer.",cr:["L'analogie était-elle adaptee a l'objection ?","A-t-elle sonne naturelle ou recitee ?","As-tu laisse le silence après l'image ?","As-tu attendu la reaction avant de continuer ?","Aurais-tu pu choisir une analogie differente — laquelle ?"]}};
var ex=exs[mi];
if(!ex)return'<div style="font-size:12px;color:#64748B;padding:20px 0;text-align:center">Exercices bientot disponibles.</div>';
var sh=ex.steps.map(function(s,i){return'<div class="estep"><div class="esn">'+(i+1)+'</div><div class="esb"><div class="estt">'+s.t+'</div><div class="esd">'+s.d+'</div></div></div>';}).join('');
var ch=ex.checks.map(function(c,i){var k='ex'+mi+'_'+i,dk=!!PROG[k];return'<div class="cki '+(dk?'done':'')+'\" data-ck="'+k+'" onclick="tickCk(\''+k+'\')"><div class="ckb">'+(dk?'&#10003;':'')+'</div><div class="ckt">'+c+'</div></div>';}).join('');
var cr=ex.rp.cr.map(function(c){return'<li>'+c+'</li>';}).join('');
return'<div class="exc"><div class="ext">'+ex.t+'</div><div class="exs">'+ex.s+'</div>'+sh+'</div><div class="exc"><div class="ext">Checklist de progression</div><div style="margin-top:6px">'+ch+'</div></div><div class="rpb"><div class="rpt">Roleplay — mise en situation</div><div class="rpsc">'+ex.rp.sc+'</div><div class="rpcl">Criteres d\'évaluation</div><ul class="rpcr">'+cr+'</ul></div>';
}
function buildDashboard(){
  var td=0,ta=0,rows=[];
  var nm={1:'Fondations',2:'Neurosciences',3:'Profils DISC+PCM',4:'Structure appel',5:'Follow-up',6:'Fausses croyances',7:'Ferocite & Flow',8:'Performer',11:'Avant-Appel'};
  var modKeys=[1,2,3,4,5,6,7,8];
  modKeys.forEach(function(i){var m=MODS[i];if(!m)return;var t=m.chs.length,d=0;m.chs.forEach(function(_,ci){if(PROG[key(i,ci)])d++;});td+=d;ta+=t;rows.push({n:nm[i]||'Module '+i,pct:Math.round(d/t*100),tp:'g'});});
  if(MODS[11]){var m11=MODS[11],t11=m11.chs.length,d11=0;m11.chs.forEach(function(_,ci){if(PROG[key(11,ci)])d11++;});}
  var at=ANC.length,ad=0;ANC.forEach(function(_,ci){if(PROG[key(9,ci)])ad++;});td+=ad;ta+=at;rows.push({n:"Bonus — L\'Ancrage",pct:Math.round(ad/at*100),tp:'p'});
  var alt=ANAL.length,ald=0;ANAL.forEach(function(_,ci){if(PROG[key(10,ci)])ald++;});td+=ald;ta+=alt;rows.push({n:'Bonus — Analogies',pct:Math.round(ald/alt*100),tp:'t'});
  var g=Math.round(td/ta*100);
  var nx=g===0?'Commence par le Module 0 — Fondations & Mindset.':g<30?'Continue dans l\'ordre. Chaque module s\'appuie sur le précédent.':g<60?'Intègre les bonus quand les fondations sont solides.':'Formation complète. Forme à ton tour.';
  var rh=rows.map(function(r){return'<div class="pr"><div class="prn">'+r.n+'</div><div class="prt"><div class="prtb"><div class="prtf '+r.tp+'" style="width:'+r.pct+'%"></div></div></div><div class="prp">'+r.pct+'%</div></div>';}).join('');
  var cardMeta={1:{ac:'var(--or)',bl:"La discipline avant la technique. Les saisons du closer et l'identité force vs besoin."},2:{ac:'#6B9FD4',bl:"Le cerveau émotionnel décide en premier. 9 piliers, PDF de reference inclus."},3:{ac:'#6BAF8A',bl:"Chaque prospect est cable differemment. Detection rapide et scripts calibres."},4:{ac:'var(--or)',bl:"8 phases, de la préparation au paiement. Le coeur operationnel de la formation."},5:{ac:'#6B9FD4',bl:"Le closing continue apres le raccroche. 6 categories de perte, 6 angles universels."},6:{ac:'#C97A6B',bl:"Prix, réflexion, tierce personne, confiance — chaque objection a son protocole."},7:{ac:'var(--or)',bl:"L'état de performance optimal comme une habitude construite, pas subie."},8:{ac:'#6BAF8A',bl:"CRM, debrief structure, prospection — professionnaliser ton activité."}};
  var cardOrder=[1,2,3,4,5,6,7,8];
  var cardsHtml=cardOrder.map(function(mi){
    var m=MODS[mi];if(!m)return'';
    var meta=cardMeta[mi]||{ac:'var(--or)',bl:''};
    var ct=m.title.replace(/<[^>]+>/g,'');
    return '<div class="axiscard" style="--card-accent:'+meta.ac+'" onclick="switchMod('+mi+')"><div class="axn">'+m.cat+'</div><div class="axt">'+ct+'</div><div class="axd">'+meta.bl+'</div><div class="axc">'+m.chs.length+' chapitres</div></div>';
  }).join('');
  return'<div class="sec-label">Par ou commencer</div><div class="axisgrid">'+cardsHtml+'</div><div class="dash-grid"><div class="dash-card"><div class="dash-card-title">Chapitres complétés</div><div style="font-family:var(--serif,serif);font-size:40px;color:var(--or);line-height:1">'+td+'</div><div style="font-size:12px;color:var(--gris-light);margin-top:6px">sur '+ta+' au total</div></div><div class="dash-card"><div class="dash-card-title">Progression globale</div><div style="font-size:40px;color:var(--or);line-height:1;font-weight:600">'+g+'%</div><div style="height:3px;background:#222;border-radius:2px;margin-top:10px"><div style="height:100%;width:'+g+'%;background:var(--or);border-radius:2px"></div></div></div></div><div class="dash-card" style="margin-bottom:16px"><div class="dash-card-title">Progression par module</div>'+rh+'</div><div class="next-box"><div class="next-label">Prochaine étape</div><div class="next-text">'+nx+'</div></div>';
}
function buildBody(){
  if(CM===0)return buildDashboard();
  if(CT==='exercices')return buildExercise(CM);
  if(CM===9)return buildAnchor();
  if(CM===10)return buildAnalogies();
  return buildChapters(CM);
}
function renderPage(){
  var area=document.getElementById('main');if(!area)return;
  if(CM===0){area.innerHTML='<div class="mh"><div class="mcat g">Vue d\'ensemble</div><div class="mtit">Tableau de <span class="ag">bord</span></div><div class="mdesc">Suis ta progression. Coche les chapitres termines directement dans le contenu.</div></div><div class="body">'+buildDashboard()+'</div>';return;}
  var isA=CM===9,isN=CM===10,pc=isA||isN;
  var cat,tit,desc;
  if(isA){cat='Bonus - Technique avancee';tit='<span class="ap">L\'Ancrage</span>';desc="3 formats de questions calibrees. Integre naturellement a la découverte selon le profil et le moment.";}
  else if(isN){cat='Bonus - Technique incarnee';tit='<span class="at">Les Analogies</span>';desc="9 analogies calibrees. Ce qui fait la difference : l'incarnation, pas la technique.";}
  else{var mo=MODS[CM];cat=mo.cat;tit=mo.title;desc=mo.desc;}
  var cl=isA?'p':isN?'t':'g';
  area.innerHTML='<div class="mh"><div class="mcat '+cl+'">'+cat+'</div><div class="mtit">'+tit+'</div><div class="mdesc">'+desc+'</div></div><div class="tabs"><div class="tab on'+(pc?' p':'')+'" data-tab="cours" onclick="switchTab(\'cours\')">Cours</div><div class="tab'+(pc?' p':'')+'" data-tab="exercices" onclick="switchTab(\'exercices\')">Exercices & Roleplay</div></div><div class="body" id="ba">'+buildBody()+'</div>';
  document.querySelectorAll('.tab').forEach(function(el){el.classList.toggle('on',el.dataset.tab===CT)});
}
function renderAdmin(){
  var students=lSt();
  var cards=students.map(function(s){
    var prog=lProg(s.code),td=0,ta=0;
    for(var i=1;i<=8;i++){var m=MODS[i];if(!m)continue;var t=m.chs.length,d=0;m.chs.forEach(function(_,ci){if(prog[key(i,ci)])d++;});td+=d;ta+=t;}
    ANC.forEach(function(_,ci){if(prog[key(9,ci)])td++;});ta+=ANC.length;
    ANAL.forEach(function(_,ci){if(prog[key(10,ci)])td++;});ta+=ANAL.length;
    var pct=Math.round(td/ta*100);
    var nm={1:'Fondations',2:'Neuro',3:'Profils',4:'Structure',5:'Decouverte',6:'Objections',7:'Flow',8:'Performer'};
    var bars='';
    for(var i=1;i<=8;i++){var m=MODS[i];if(!m)continue;var t=m.chs.length,d=0;m.chs.forEach(function(_,ci){if(prog[key(i,ci)])d++;});var p=Math.round(d/t*100);bars+='<div class="strow"><div class="strn">'+nm[i]+'</div><div class="sttr"><div class="stbf" style="width:'+p+'%"></div></div><div class="stpp">'+p+'%</div></div>';}
    return'<div class="stcard"><div class="stg"><div class="stav">'+(s.initials||s.name.substring(0,2).toUpperCase())+'</div><div><div class="stnm">'+s.name+'</div><div class="stco">'+s.code+'</div></div><div class="stpc">'+pct+'%</div></div><div class="stbars">'+bars+'</div></div>';
  }).join('');

}
function addSt(){
  var name=document.getElementById('an').value.trim();
  var code=document.getElementById('ac').value.trim().toUpperCase();
  if(!name||!code){document.getElementById('ae').textContent='Prenom et code requis.';return}
  if(code===ADMIN){document.getElementById('ae').textContent='Code reserve.';return}
  var st=lSt();
  if(st.find(function(s){return s.code===code})){document.getElementById('ae').textContent='Ce code existe déjà.';return}
  st.push({name:name,code:code,initials:name.substring(0,2).toUpperCase()});
  sSt(st);renderAdmin();
}
